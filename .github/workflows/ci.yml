name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m drought demo --outdir out
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: |
            out/report.json
            out/demo_scores.json
            out/regional_timeseries.csv
            out/overview.png

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t drought .
      - run: docker run --rm drought
